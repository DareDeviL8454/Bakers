{% extends 'basic.html' %}

{% block title %}contact{% endblock title %}

{% block body %}
<div class="container-fluid px-0">
   <img src="https://source.unsplash.com/1600x400/?phone,contact" class="d-block w-100" alt="...">

</div>
 <h3 class=" text-center my-2">Contact Us</h3>

<!--Contact Form -->


<div class="container py-4">
    <form method="post">
        {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Email address</label>
        <input type="email" class="form-control" id="exampleFormControlInput1" name="email" placeholder="name@example.com">
    </div>


     <div class="mb-3">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="phone" class="form-control" id="phone" name="phone" placeholder="Enter your Phone Number">
    </div>


    <div class="mb-3">
        <label for="desc" class="form-label">Reason to contact us....</label>
        <textarea class="form-control" id="desc" rows="3" name="desc"></textarea>
    </div>

    <button class="btn btn-primary" type="submit">Submit</button>
</form>
</div>


{% endblock body %}
